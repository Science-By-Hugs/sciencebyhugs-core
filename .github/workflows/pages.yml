name: Deploy Core to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Generate production PWA icons
        run: |
          rsvg-convert -w 192 -h 192 public/brand/core-app-icon.svg -o public/brand/core-icon-192.png
          rsvg-convert -w 512 -h 512 public/brand/core-app-icon.svg -o public/brand/core-icon-512.png
          rsvg-convert -w 180 -h 180 public/brand/core-app-icon.svg -o public/brand/core-apple-touch-icon.png

      - name: Production configuration checks
        run: node scripts/verify-production.mjs

      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Verify built PWA
        run: node scripts/verify-production.mjs --dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
