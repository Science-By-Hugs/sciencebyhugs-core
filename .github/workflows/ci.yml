name: Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin postgresql-client

      - name: Generate production PWA icons
        run: |
          rsvg-convert -w 192 -h 192 public/brand/core-app-icon.svg -o public/brand/core-icon-192.png
          rsvg-convert -w 512 -h 512 public/brand/core-app-icon.svg -o public/brand/core-icon-512.png
          rsvg-convert -w 180 -h 180 public/brand/core-app-icon.svg -o public/brand/core-apple-touch-icon.png

      - name: Production configuration checks
        run: node scripts/verify-production.mjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Account, inventory and push notification tests
        run: node --test tests/*.test.cjs

      - name: Inventory PostgreSQL migration and receiving integration tests
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -f tests/inventory-multi-db.sql

      - name: CORE push-volume PostgreSQL regression (transaction rollback)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -f tests/core-push-volume-db.sql

      - name: Discount deletion PostgreSQL integration (temporary database, rollback)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -f tests/core-discount-delete-db.sql

      - name: Shipping source rename PostgreSQL integration (temporary database, rollback)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -f tests/core-shipping-source-merge-db.sql

      - name: Finance reconciliation PostgreSQL integration (temporary database, rollback)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -f tests/core-financial-reconciliation-db.sql

      - name: Monthly Profit and Loss PostgreSQL integration (temporary database, rollback)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -f tests/core-monthly-pnl-db.sql

      - name: Two-session checkout contention test (temporary database only)
        env:
          PGPASSWORD: postgres
        run: bash tests/inventory-checkout-race.sh

      - name: Verify built PWA
        run: node scripts/verify-production.mjs --dist
